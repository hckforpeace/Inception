version: "8.2"

# services
services:

  # Mandatory Part
#mariadb
  mariadb:
    image: mariadb:user # user to say that the image mariadb is custom
    container_name: mariadb
    build: requirements/mariadb
    secrets:
      - db_password
      - db_root_password
    env_file:
      - .env
    networks:
      - inception # Connects container to the inception network for inter-container communication
    restart: always # insures that the container restart in case of failure
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "nc", "-zv", "mariadb", "3306"] #command that will define if the container is healthy or not
      interval: 1s # runs the health check every 1 second
      timeout: 5s # set the maximum time for the healthcheck to run, means it must be completed within 5 seconds
      retries: 18 # Specifies the number of consecutive failures needed to consider the container unhealthy (default: 3)
#nginx
  nginx:
    image: nginx:user
    container_name: nginx
    build: requirements/nginx
    ports: # port binding 442 on the host to 443 on the container
      - "443:443"
    depends_on: # insures that wordpress service starts before Nginx
      - wordpress
    volumes:
      - wordpress:/var/www/wordpress
    networks:
      - inception
    restart: always
# wordpress
  wordpress:
    image: wordpress:user
    container_name: wordpress
    build: requirements/wordpress
    secrets:
      - db_password
      - wp_adm_password
      - wp_usr_password
    depends_on: # the container wodpress wont run before the container mariadb runs
      mariadb:
        condition: service_healthy # and it will run only if it is healthy (succeeded to run, relies on healthcheck)
    volumes:
      - wordpress:/var/www/wordpress
    env_file:
      - .env
    networks:
      - inception
    restart: always

### BONUS

#vsftpd
  vsftpd:
    image:  vsftpd:user
    container_name: vsftpd
    build:  requirements/bonus/vsftpd
    ports:
      - "21:21"
      - "10000-10100:10000-10100"
    secrets:
      - ftp_pw
      - ftp_uname
    volumes:
      - wordpress:/home/pbeyloun/volume
    restart:  always

#adminer
  adminer:
    image: adminer:user
    container_name: adminer
    build: requirements/bonus/adminer
    ports:
      - "8085:8085"
    networks:
      - inception
    restart: always

#redis
  redis:
    image: redis:user
    container_name: redis 
    build: requirements/bonus/redis
    networks:
      - inception
    restart: always
    volumes:
      - redis:/var/lib/redis

#lighttpd
  lighttpd:
    image: lighttpd:user
    container_name: lighttpd 
    build: requirements/bonus/lighttpd
    ports:
      - 8081:8081
    networks:
      - inception
    restart: always

#cadvisor
  cadvisor:
    image: cadvisor:user
    container_name: cadvisor
    build: requirements/bonus/cadvisor
    ports:
      - 8080:8080
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

# Volumes
volumes:
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: /home/${USER}/data/mariadb # To change in case I change laptop
      o : bind
      type : none
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: /home/${USER}/data/wordpress # To change in case I change laptop
      o: bind
      type: none
  redis:
    name: redis
    driver: local
    driver_opts:
      device: /home/${USER}/data/redis # To change in case I change laptop
      o: bind
      type: none

# network
networks:
  inception:
    name: inception

# secrets
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_adm_password:
    file: ../secrets/wp_adm_pw.txt
  wp_usr_password:
    file: ../secrets/wp_usr_pw.txt
  ftp_pw:
    file: ../secrets/ftp_pw.txt
  ftp_uname:
    file: ../secrets/ftp_uname.txt
